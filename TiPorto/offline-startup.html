<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>TiPorto</title>
<style>
html,body{margin:0;min-height:100%;background:#27272a;color:#fafafa;font-family:system-ui,sans-serif}
.notice{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;right:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.pill{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border:1px solid #71717a;border-radius:999px;background:#3f3f46;font-size:12px}
button{width:44px;height:44px;border:0;border-radius:50%;background:#52525b;color:#fafafa;font-size:24px;cursor:pointer}
main{padding:calc(env(safe-area-inset-top,0px) + 96px) 28px 32px;text-align:center}
h1{font-size:36px}p{line-height:1.6;color:#d4d4d8;max-width:34rem;margin:24px auto}
</style>
</head>
<body>
<div class="notice" role="status"><div class="pill">Sei offline<button type="button" aria-label="Riprova la connessione" onclick="retry()">↻</button></div></div>
<main><h1>TiPorto</h1><p>I file offline non sono ancora disponibili su questo dispositivo. Dopo la prima apertura con una connessione, potrai consultare anche offline i dati scaricati.</p></main>
<script>
function retry() {
  const message = {action: "retryOffline"};
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.inertiaNav) {
    window.webkit.messageHandlers.inertiaNav.postMessage(message);
  } else if (window.inertiaNav) {
    window.inertiaNav.postMessage(JSON.stringify(message));
  }
}
</script>
</body>
</html>
